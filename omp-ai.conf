# omp-ai.conf
#
# Configuration for setup-omp-ai.sh
# Format: KEY=VALUE
#
# Sections are cosmetic. Full-line # and ; comments are ignored.
# Do not add inline comments after a value.
#
# IMPORTANT: this file can contain EXA_API_KEY.
# Keep it private:
#   chmod 600 omp-ai.conf
#
# Usually you only need MODEL_PATH and optionally EXA_API_KEY.

[model]

# REQUIRED on first install only.
# Path to the GGUF model to copy into the isolated AI area.
# "~/" is supported here.
# After installation you may leave it empty on future runs unless replacing it.
MODEL_PATH=

# OPTIONAL: llama.cpp CUDA container image.
LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda

# OPTIONAL: context window. 8192 is a conservative start for 32 GiB RAM.
LLAMA_CTX=8192

# OPTIONAL: hard RAM limit for llama.cpp.
LLAMA_MEM=22g

# OPTIONAL: VRAM llama.cpp should try to leave free, in MiB.
# 2048 is a reasonable start for an RTX 3070 Ti 8 GiB.
VRAM_RESERVE_MIB=2048

# OPTIONAL: localhost-only health/API port used by the launcher.
LLAMA_PORT=18080


[search]

# OPTIONAL.
# Exa API key. If filled and WEB_SEARCH_PRIMARY=auto, Exa is primary.
# The installer copies this to /var/lib/ompai/secrets/omp.env (root:ompai, 0640).
# It is never placed in ~/AI.
#
# Important: OMP receives the key as an environment variable, so a compromised
# agent can potentially read it. This protects it from workspace exposure, not
# from OMP itself.
EXA_API_KEY=

# OPTIONAL: auto | exa | duckduckgo
#
# auto:
#   EXA_API_KEY set   -> exa
#   EXA_API_KEY empty -> duckduckgo
#
# Explicit "exa" can also use OMP's public Exa MCP path without a key.
WEB_SEARCH_PRIMARY=auto

# OPTIONAL: exa | duckduckgo | none
WEB_SEARCH_FALLBACK=duckduckgo


[omp]

# OPTIONAL: OMP repository and revision to build.
OMP_REPO=https://github.com/can1357/oh-my-pi.git
OMP_REF=main

# OPTIONAL: hard RAM limit for OMP.
OMP_MEM=3g


[isolation]

# OPTIONAL. Avoid changing these after initial installation unless you know why.
AI_USER=ompai
AI_HOME=/var/lib/ompai
SHARE_GROUP=ompai-share
WORKSPACE=/srv/ompai/workspace

# OPTIONAL: root-owned hard limits for the whole ompai user slice.
# They still apply if a process escapes a container but remains user ompai.
AI_SLICE_MEM=25G

# 2400% ~= 24 logical CPUs worth of CPU time.
AI_SLICE_CPU=2400%

# OPTIONAL: true/false.
# Recommended true: remove group/other permissions from your normal home.
HARDEN_HOME=true


[installer]

# OPTIONAL: true/false.
# true suppresses interactive confirmation prompts.
ASSUME_YES=false
