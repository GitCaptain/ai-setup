# omp-ai.conf
# Main installation configuration for setup-omp-ai.sh.
# Format: KEY=VALUE. Section headers are cosmetic.
# Keep this file chmod 0600 if EXA_API_KEY is set.

[models]
MODEL_STORE=/var/lib/ompai/models
# MODEL=~/Downloads/Qwen3.8-27B-Q4_K_M.gguf
MODELS_MAX=1

[llama]
LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda

# These llama tuning values seed $AI_HOME/config/runtime.conf on first install.
# After installation use `omp-ai config edit`; setup preserves that live file.

# Two OMP windows can actively generate at the same time.
LLAMA_PARALLEL=2

# Total shared KV context pool for the model, regardless of slot count.
# With unified KV, one active request can use up to this pool; concurrent
# requests share it dynamically. It is NOT multiplied by LLAMA_PARALLEL.
LLAMA_CTX_TOTAL=65536

# Process/cgroup cap for llama.cpp.
LLAMA_MEM=22g

# Keep desktop VRAM headroom on the RTX 3070 Ti.
VRAM_RESERVE_MIB=512

# 4 = trace; needed to see CUDA/offload/model/KV buffer details in llama.cpp logs.
LLAMA_LOG_VERBOSITY=4
LLAMA_PORT=18080

# Keep disabled for now: current llama.cpp has an open cross-slot cache issue
# under concurrent load. Continuous batching itself remains enabled.
LLAMA_CACHE_RAM_MIB=0

[speculative]
# Applied only to the named target model via llama.cpp router model preset.
# The MTP sidecar is stored outside MODEL_STORE, so it does not appear in /model.
DRAFT_STORE=/var/lib/ompai/drafts
SPEC_MODE=mtp
SPEC_TARGET_MODEL=Qwen3.8-27B-Q4_K_M
SPEC_DRAFT_FILE=mtp-Qwen3.8-27B-Q4_0.gguf
SPEC_DRAFT_N_MAX=4
SPEC_DRAFT_P_MIN=0.8
SPEC_DRAFT_NGL=all
SPEC_DRAFT_CACHE_TYPE=q4_0

[search]
EXA_API_KEY=
WEB_SEARCH_PRIMARY=auto
WEB_SEARCH_FALLBACK=duckduckgo

[omp]
# Empty = latest stable prebuilt OMP release.
# To pin a specific release tag, set for example: OMP_VERSION=v18.1.15
OMP_VERSION=

# Persistent coding workbench base. Debian 13 (Trixie) is the default.
# Ubuntu 26.04 also works because this image build expects apt + glibc.
WORKBENCH_BASE_IMAGE=debian:13-slim

# Memory ceiling for the persistent workbench (OMP + compilers/tools).
OMP_MEM=3g

[isolation]
AI_USER=ompai
AI_HOME=/var/lib/ompai
SHARE_GROUP=ompai-share
WORKSPACE=/srv/ompai/workspace
AI_SLICE_MEM=25G
AI_SLICE_CPU=2400%
HARDEN_HOME=true

[installer]
ASSUME_YES=false
