# omp-ai.conf
#
# Configuration for setup-omp-ai.sh
# Format: KEY=VALUE
#
# Sections are cosmetic. Full-line # and ; comments are ignored.
# Do not put inline comments after values.
# Repeated MODEL= lines are allowed.
#
# IMPORTANT: this file can contain EXA_API_KEY.
# Keep it private:
#   chmod 600 omp-ai.conf

[models]

# OPTIONAL during installation.
# Each MODEL= entry imports one model into the protected model store.
# You may repeat MODEL= as many times as you want.
#
# A MODEL may be:
#   1) one ordinary .gguf file, or
#   2) a directory containing one logical model bundle, e.g. multimodal
#      model.gguf + mmproj*.gguf, or a sharded model.
#
# These paths are only used by the installer to COPY models into
# /var/lib/ompai/models. Later, manage the store with `ai-model`.
# Existing entries with the same basename are skipped on installer re-runs.
#
# Examples:
# MODEL=~/Downloads/Qwen3-8B-Q4_K_M.gguf
# MODEL=~/Downloads/Qwen3.8-27B-Q4_K_M.gguf
# MODEL=~/Downloads/gemma-multimodal/

# OPTIONAL. Maximum number of model instances llama.cpp router may keep loaded
# simultaneously. KEEP THIS AT 1 for your 32 GiB RAM / 8 GiB VRAM machine.
# Models can still be switched from /model in OMP; the router will not keep
# multiple large models resident at once.
MODELS_MAX=1

# OPTIONAL. llama.cpp CUDA image.
LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda

# OPTIONAL. Common context size inherited by all models loaded by the router.
# 8192 is a conservative default for your RAM size.
LLAMA_CTX=8192

# OPTIONAL. Hard RAM cap for the llama.cpp router + loaded model process(es).
LLAMA_MEM=22g

# OPTIONAL. Target VRAM to leave free for desktop/other GPU work, in MiB.
VRAM_RESERVE_MIB=2048

# OPTIONAL. Localhost-only port used for router health/catalog checks.
LLAMA_PORT=18080


[search]

# OPTIONAL.
# Exa API key. With WEB_SEARCH_PRIMARY=auto, a non-empty key selects Exa.
# The installer stores the key outside ~/AI and passes it only to OMP.
# A compromised OMP process can still inspect its own environment and see it.
EXA_API_KEY=

# OPTIONAL: auto | exa | duckduckgo
# auto: Exa if EXA_API_KEY is set, otherwise DuckDuckGo.
WEB_SEARCH_PRIMARY=auto

# OPTIONAL: exa | duckduckgo | none
WEB_SEARCH_FALLBACK=duckduckgo


[omp]

# OPTIONAL. OMP source repository and revision to build.
OMP_REPO=https://github.com/can1357/oh-my-pi.git
OMP_REF=main

# OPTIONAL. Hard RAM cap for the OMP agent container.
OMP_MEM=3g


[isolation]

# OPTIONAL. Avoid changing these after initial install unless you mean to
# migrate the environment.
AI_USER=ompai
AI_HOME=/var/lib/ompai
SHARE_GROUP=ompai-share
WORKSPACE=/srv/ompai/workspace

# OPTIONAL. Root-owned hard limits for the entire ompai host-user slice.
# They still apply if a process escapes a container but remains user ompai.
AI_SLICE_MEM=25G

# 2400% ~= 24 logical CPUs worth of CPU time.
AI_SLICE_CPU=2400%

# OPTIONAL: true | false
# Recommended true: remove group/other access from your normal $HOME.
HARDEN_HOME=true


[installer]

# OPTIONAL: true | false
# true accepts recommended installer prompts automatically.
ASSUME_YES=false
