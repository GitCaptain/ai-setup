# omp-ai.conf
# Main installation configuration for setup-omp-ai.sh.
# Format: KEY=VALUE. Section headers are cosmetic.
# Keep this file chmod 0600 if EXA_API_KEY is set.

[models]
# Desktop user manages this store; isolated user ompai gets read-only access.
MODEL_STORE=/mnt/shared/AI_MODELS/
DRAFT_STORE=/var/lib/ompai/drafts
MODELS_MAX=1

[llama]
LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda
LLAMA_PORT=18080
LLAMA_MEM=22g

# One active decode stream gives best single-session throughput on the 3070 Ti.
LLAMA_PARALLEL=1
VRAM_RESERVE_MIB=256
LLAMA_LOG_VERBOSITY=4
LLAMA_CACHE_RAM_MIB=0

# Fallback profile for discovered models without a dedicated profile below.
LLAMA_CTX_TOTAL=32768
LLAMA_CACHE_TYPE_K=f16
LLAMA_CACHE_TYPE_V=f16

# Fast/default workhorse: benchmarked at ~83.6 tok/s on RTX 3070 Ti 8 GB.
WORK_MODEL=Qwen3.5-9B-Q4_K_M
WORK_CTX_TOTAL=65536
WORK_CACHE_TYPE_K=q8_0
WORK_CACHE_TYPE_V=q8_0

[speculative]
# Slow/heavy reasoning profile: 27B + MTP, benchmarked best at 32K/f16.
SPEC_MODE=mtp
SPEC_TARGET_MODEL=Qwen3.8-27B-Q4_K_M
SPEC_CTX_TOTAL=32768
SPEC_CACHE_TYPE_K=f16
SPEC_CACHE_TYPE_V=f16
SPEC_DRAFT_FILE=mtp-Qwen3.8-27B-Q4_0.gguf
SPEC_DRAFT_N_MAX=8
SPEC_DRAFT_P_MIN=0.8
SPEC_DRAFT_NGL=all
SPEC_DRAFT_CACHE_TYPE=q4_0

[search]
# If you already have an Exa key in your existing config, keep/copy it here.
EXA_API_KEY=
WEB_SEARCH_PRIMARY=auto
WEB_SEARCH_FALLBACK=duckduckgo

[omp]
OMP_VERSION=
WORKBENCH_BASE_IMAGE=debian:13-slim
OMP_MEM=3g

[isolation]
AI_USER=ompai
AI_HOME=/var/lib/ompai
SHARE_GROUP=ompai-share
WORKSPACE=/srv/ompai/workspace
AI_SLICE_MEM=25G
AI_SLICE_CPU=2400%
HARDEN_HOME=true

[installer]
ASSUME_YES=false
