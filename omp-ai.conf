# omp-ai.conf
#
# Main configuration for setup-omp-ai.sh.
# Format: KEY=VALUE. Sections are cosmetic.
# If EXA_API_KEY is set, keep this file mode 0600.

[models]

# Persistent host directory managed by ai-model.
# Must be absolute and outside your normal $HOME.
MODEL_STORE=/var/lib/ompai/models

# Optional installer-time imports. Repeat MODEL= as needed.
# MODEL=~/Downloads/Qwen3-8B-Q4_K_M.gguf
# MODEL=~/Downloads/Qwen3.8-27B-Q4_K_M.gguf

# Keep 1 on a 32 GiB RAM / 8 GiB VRAM machine.
MODELS_MAX=1

LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda
LLAMA_CTX=8192
LLAMA_MEM=22g
VRAM_RESERVE_MIB=2048
LLAMA_PORT=18080

[search]

# Optional. With WEB_SEARCH_PRIMARY=auto, non-empty key selects Exa.
EXA_API_KEY=
WEB_SEARCH_PRIMARY=auto
WEB_SEARCH_FALLBACK=duckduckgo

[omp]

OMP_REPO=https://github.com/can1357/oh-my-pi.git
OMP_REF=main
OMP_MEM=3g

[isolation]

AI_USER=ompai
AI_HOME=/var/lib/ompai
SHARE_GROUP=ompai-share

# Persistent normal workspace. Exposed to the desktop as ~/AI.
WORKSPACE=/srv/ompai/workspace

# Hard limits for every host process running as ompai.
AI_SLICE_MEM=25G
AI_SLICE_CPU=2400%

# Recommended: prevents escaped ompai processes from traversing your normal home.
HARDEN_HOME=true

[installer]
ASSUME_YES=false
